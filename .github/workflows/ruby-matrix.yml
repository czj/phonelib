name: Ruby matrix

on: push

jobs:
  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.6", "2.7", "3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/ci.gemfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Allocations on master, #374 and this branch
        run: |
          for revision in 3e0dac9:master c255634:#374 HEAD:branch; do
            git checkout -q ${revision%%:*} -- lib
            bundle exec ruby -Ilib .github/allocations_probe.rb ${revision#*:} | tee -a $GITHUB_STEP_SUMMARY
          done
          git checkout -q HEAD -- lib
      - run: bundle exec rspec spec/allocations_spec.rb spec/phonelib_spec.rb spec/validation_spec.rb spec/cache_invalidation_spec.rb spec/data_importer_helper_spec.rb
